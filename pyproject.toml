[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gai-commit"
version = "0.1.2"
authors = [
    { name = "Muzahid", email = "mmsaddam@gmail.com" },
]
description = "An AI-powered git commit message generator."
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Version Control :: Git",
    "Topic :: Utilities",
]
dependencies = [
    "requests",
    "python-dotenv",
    "openai",
    "tree-sitter>=0.20.0,<0.21.0",
    "tree-sitter-languages>=1.7.0",
]

[project.urls]
"Homepage" = "https://github.com/muzahid59/gai"
"Bug Tracker" = "https://github.com/muzahid59/gai/issues"

[project.scripts]
gai = "gai.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "black",
    "flake8",
]

# Essential setuptools configuration
[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["tests*", "*tests*"]

# Package data exclusions (for wheel files)
[tool.setuptools.exclude-package-data]
"*" = [
    "*.benchmark.*",
    "*.test.*",
    "test_*",
]